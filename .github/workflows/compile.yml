name: Build PDFs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'saz_*.py'
      - 'lod_*.py'
      - 'verify_*.py'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'saz_*.py'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild of all volumes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEXMFVAR: ${{ github.workspace }}/tmp/texmfvar
      TEXMFCACHE: ${{ github.workspace }}/tmp/texmfvar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Dependencies per Volume
        id: detect
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          def get_volume_deps(master_file):
              if not os.path.exists(master_file):
                  return set()
              with open(master_file, "r", encoding="utf-8") as f:
                  text = f.read()
              lessons = [l + ("" if l.endswith(".tex") else ".tex") for l in re.findall(r"\\include\{([^}]+)\}", text)]
              deps = set(lessons) | {master_file}
              for l in lessons:
                  if os.path.exists(l):
                      with open(l, "r", encoding="utf-8") as f:
                          c = f.read()
                      for img in re.findall(r"\\includegraphics(?:\[.*?\])?\{([^}]+)\}", c):
                          deps.add(img)
                          if not img.endswith((".png", ".jpg", ".jpeg")):
                              deps.add(img + ".png")
                              deps.add(img + ".jpg")
              return deps

          def get_changed_files():
              try:
                  res = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True, check=True)
                  return set(line.strip() for line in res.stdout.splitlines() if line.strip())
              except Exception as e:
                  print(f"git diff warning: {e}")
                  return None

          changed = get_changed_files()
          if changed is None:
              print("Full rebuild triggered (could not determine diff).")
              rebuild_v1, rebuild_v2, rebuild_v3 = True, True, True
          else:
              print("Files changed in this push:")
              for f in sorted(changed):
                  print(f"  - {f}")
              
              global_files = {"Makefile", ".github/workflows/compile.yml"}
              has_global = bool(changed & global_files)

              v1_deps = get_volume_deps("letz.tex")
              v2_deps = get_volume_deps("letz2.tex")
              v3_deps = get_volume_deps("letz3.tex")

              rebuild_v1 = has_global or bool(changed & v1_deps)
              rebuild_v2 = has_global or bool(changed & v2_deps)
              rebuild_v3 = has_global or bool(changed & v3_deps)

          print(f"Decision -> Volume 1: {rebuild_v1}, Volume 2: {rebuild_v2}, Volume 3: {rebuild_v3}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"rebuild_v1={'true' if rebuild_v1 else 'false'}\n")
                  f.write(f"rebuild_v2={'true' if rebuild_v2 else 'false'}\n")
                  f.write(f"rebuild_v3={'true' if rebuild_v3 else 'false'}\n")
          EOF

      - name: Cache Volume 1 PDF
        id: cache-vol1
        uses: actions/cache@v4
        with:
          path: letz.pdf
          key: vol1-pdf-${{ hashFiles('letz.tex', 'lessons/lesson[1-9].tex', 'lessons/lesson1[0-9].tex', 'lessons/lesson20.tex') }}

      - name: Cache Volume 2 PDF
        id: cache-vol2
        uses: actions/cache@v4
        with:
          path: letz2.pdf
          key: vol2-pdf-${{ hashFiles('letz2.tex', 'lessons/lesson2[1-9].tex', 'lessons/lesson3[0-1].tex') }}

      - name: Cache Volume 3 PDF
        id: cache-vol3
        uses: actions/cache@v4
        with:
          path: letz3.pdf
          key: vol3-pdf-${{ hashFiles('letz3.tex', 'lessons/lesson3[2-9].tex', 'lessons/lesson[4-9]*.tex') }}

      - name: Install system fonts and LuaLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-luatex \
            fonts-noto-core

      - name: Cache LuaTeX font database
        uses: actions/cache@v4
        with:
          path: tmp/texmfvar
          key: ${{ runner.os }}-luatex-cache-v2
          restore-keys: |
            ${{ runner.os }}-luatex-cache-

      - name: Initialize font index
        run: |
          mkdir -p "$TEXMFVAR"
          sudo fc-cache -fv
          luaotfload-tool --update --verbose=1

      - name: Build or Restore Volume 1 (Lessons 1-20)
        run: |
          FORCE="${{ inputs.force_rebuild == true }}"
          REBUILD="${{ steps.detect.outputs.rebuild_v1 == 'true' }}"
          if [ "$FORCE" = "true" ] || [ "$REBUILD" = "true" ]; then
            echo "Building Volume 1 from source (changes detected)..."
            make vol1 || {
              echo "::error::Volume 1 compilation failed"
              grep -n -C 3 "^!" letz.log | while IFS= read -r line; do echo "::error::$line"; done
              tail -n 50 letz.log | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          elif [ ! -f "letz.pdf" ]; then
            echo "Volume 1 unchanged; downloading stable release asset..."
            curl -sSL -o letz.pdf https://github.com/tigran-a/elements-of-luxembourgish/releases/download/v0.1.35/letz.pdf || make vol1
          else
            echo "Volume 1 unchanged; restored from cache."
          fi

      - name: Build or Restore Volume 2 (Lessons 21-31)
        run: |
          FORCE="${{ inputs.force_rebuild == true }}"
          REBUILD="${{ steps.detect.outputs.rebuild_v2 == 'true' }}"
          if [ "$FORCE" = "true" ] || [ "$REBUILD" = "true" ]; then
            echo "Building Volume 2 from source (changes detected)..."
            make vol2 || {
              echo "::error::Volume 2 compilation failed"
              grep -n -C 3 "^!" letz2.log | while IFS= read -r line; do echo "::error::$line"; done
              tail -n 50 letz2.log | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          elif [ ! -f "letz2.pdf" ]; then
            echo "Volume 2 unchanged; downloading stable release asset..."
            curl -sSL -o letz2.pdf https://github.com/tigran-a/elements-of-luxembourgish/releases/download/v0.1.35/letz2.pdf || make vol2
          else
            echo "Volume 2 unchanged; restored from cache."
          fi

      - name: Build or Restore Volume 3 (Lessons 32+)
        run: |
          FORCE="${{ inputs.force_rebuild == true }}"
          REBUILD="${{ steps.detect.outputs.rebuild_v3 == 'true' }}"
          if [ "$FORCE" = "true" ] || [ "$REBUILD" = "true" ] || [ ! -f "letz3.pdf" ]; then
            echo "Building Volume 3 from source..."
            make vol3 || {
              echo "::error::Volume 3 compilation failed"
              grep -n -C 3 "^!" letz3.log | while IFS= read -r line; do echo "::error::$line"; done
              tail -n 50 letz3.log | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          else
            echo "Volume 3 unchanged; restored from cache."
          fi

      - name: Upload Compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: elements-of-luxembourgish-pdfs
          path: |
            letz.pdf
            letz2.pdf
            letz3.pdf

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            letz.log
            letz2.log
            letz3.log

      - name: Prepare Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD_V1: ${{ steps.detect.outputs.rebuild_v1 }}
          REBUILD_V2: ${{ steps.detect.outputs.rebuild_v2 }}
          REBUILD_V3: ${{ steps.detect.outputs.rebuild_v3 }}
        run: |
          mkdir -p release_assets

          python3 - << 'EOF'
          import os, json, urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY", "tigran-a/elements-of-luxembourgish")
          token = os.environ.get("GITHUB_TOKEN")
          rebuild_v1 = os.environ.get("REBUILD_V1") == "true"
          rebuild_v2 = os.environ.get("REBUILD_V2") == "true"
          tag = os.environ.get("GITHUB_REF_NAME", "latest")

          # Fallback URLs
          v1_url = f"https://github.com/{repo}/releases/download/v0.1.35/letz.pdf"
          v2_url = f"https://github.com/{repo}/releases/download/v0.1.35/letz2.pdf"

          # Query GitHub API to locate the latest published releases containing Volume 1 and Volume 2
          try:
              headers = {"User-Agent": "CI"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", headers=headers)
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode())
              
              found_v1, found_v2 = False, False
              for rel in releases:
                  for asset in rel.get("assets", []):
                      name = asset.get("name")
                      dl = asset.get("browser_download_url")
                      if name == "letz.pdf" and not found_v1:
                          v1_url = dl
                          found_v1 = True
                      if name == "letz2.pdf" and not found_v2:
                          v2_url = dl
                          found_v2 = True
          except Exception as e:
              print(f"Notice: using default release asset URLs ({e})")

          # If rebuilt in THIS release, it will be uploaded under this tag:
          if rebuild_v1:
              v1_url = f"https://github.com/{repo}/releases/download/{tag}/letz.pdf"
          if rebuild_v2:
              v2_url = f"https://github.com/{repo}/releases/download/{tag}/letz2.pdf"

          print(f"Target Volume 1 download URL: {v1_url}")
          print(f"Target Volume 2 download URL: {v2_url}")

          # Write browser shortcut files
          with open("release_assets/Volume_1_Download_Link.url", "w", encoding="utf-8") as f:
              f.write(f"[InternetShortcut]\nURL={v1_url}\n")
          with open("release_assets/Volume_2_Download_Link.url", "w", encoding="utf-8") as f:
              f.write(f"[InternetShortcut]\nURL={v2_url}\n")

          # Write text summary file
          with open("release_assets/VOLUMES_LINKS.txt", "w", encoding="utf-8") as f:
              f.write("Elements of Luxembourgish - Volume Download Links\n\n")
              f.write(f"Volume 1 (Lessons 1-20):\n{v1_url}\n\n")
              f.write(f"Volume 2 (Lessons 21-31):\n{v2_url}\n\n")
              f.write(f"Volume 3 (Lessons 32+, Active):\nAttached as letz3.pdf in release {tag}\n")

          # Generate dynamic release body markdown
          v1_status = "*(Updated & attached to this release)*" if rebuild_v1 else "*(Stable / Finalized)*"
          v2_status = "*(Updated & attached to this release)*" if rebuild_v2 else "*(Stable / Finalized)*"

          body = f"""## Elements of Luxembourgish ({tag})

### Course Volumes:
* **Volume 1 (Lessons 1–20)**: [Download `letz.pdf`]({v1_url}) {v1_status}
* **Volume 2 (Lessons 21–31)**: [Download `letz2.pdf`]({v2_url}) {v2_status}
* **Volume 3 (Lessons 32+)**: Download attached `letz3.pdf` below *(Active / Growing)*
"""
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          EOF

          FORCE="${{ inputs.force_rebuild == true }}"
          if [ "$FORCE" = "true" ] || [ "${{ steps.detect.outputs.rebuild_v1 }}" = "true" ]; then
            echo "Attaching newly compiled Volume 1 PDF to this release..."
            cp letz.pdf release_assets/
          fi

          if [ "$FORCE" = "true" ] || [ "${{ steps.detect.outputs.rebuild_v2 }}" = "true" ]; then
            echo "Attaching newly compiled Volume 2 PDF to this release..."
            cp letz2.pdf release_assets/
          fi

          if [ "$FORCE" = "true" ] || [ "${{ steps.detect.outputs.rebuild_v3 }}" = "true" ] || [ -f "letz3.pdf" ]; then
            echo "Attaching Volume 3 PDF to this release..."
            cp letz3.pdf release_assets/
          fi

      - name: Publish Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
