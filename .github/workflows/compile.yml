name: Build PDFs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEXMFVAR: ${{ github.workspace }}/tmp/texmfvar
      TEXMFCACHE: ${{ github.workspace }}/tmp/texmfvar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system fonts and LuaLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-luatex \
            fonts-noto-core

      - name: Cache LuaTeX font database
        uses: actions/cache@v4
        with:
          path: tmp/texmfvar
          key: ${{ runner.os }}-luatex-cache-v2
          restore-keys: |
            ${{ runner.os }}-luatex-cache-

      - name: Initialize font index
        run: |
          mkdir -p "$TEXMFVAR"
          sudo fc-cache -fv
          luaotfload-tool --update --verbose=1

      - name: Build Volume 1 (Lessons 1-20)
        run: |
          if ! make vol1; then
            echo "::error::Volume 1 compilation failed"
            grep -n -C 3 "^!" letz.log | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 50 letz.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build Volume 2 (Lessons 21-31)
        run: |
          if ! make vol2; then
            echo "::error::Volume 2 compilation failed"
            grep -n -C 3 "^!" letz2.log | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 50 letz2.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build Volume 3 (Lessons 32+)
        run: |
          if ! make vol3; then
            echo "::error::Volume 3 compilation failed"
            grep -n -C 3 "^!" letz3.log | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 50 letz3.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Upload Compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: elements-of-luxembourgish-pdfs
          path: |
            letz.pdf
            letz2.pdf
            letz3.pdf

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            letz.log
            letz2.log
            letz3.log

      - name: Release Assets (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            letz.pdf
            letz2.pdf
            letz3.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
